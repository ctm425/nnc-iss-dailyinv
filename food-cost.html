<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NNC Food Cost (Owner)</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
:root{
  --primary:#1e3a5f;--primary-light:#2563eb;--primary-bg:#eff6ff;--success:#16a34a;--danger:#dc2626;--amber:#92400e;--amber-bg:#fef3c7;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-700:#374151;--gray-900:#111827;
  --bulk:#9a3412;--bulk-bg:#fff7ed;--line:#0f766e;--line-bg:#f0fdfa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-900);min-height:100vh}
button,input,select,textarea{font-family:inherit}
.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a5f,#0f2440);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.login-overlay.hidden{display:none}
.login-box{background:#fff;border-radius:16px;padding:36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h2{color:var(--primary);margin-bottom:6px;font-size:1.4rem}
.login-box p{color:var(--gray-500);margin-bottom:20px;font-size:.9rem}
.login-box input{width:100%;padding:12px 16px;border:1px solid var(--gray-300);border-radius:8px;font-size:16px;margin-bottom:12px}
.login-box button{width:100%;padding:12px;background:var(--primary-light);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
.login-error{background:#fef2f2;color:#991b1b;padding:10px;border-radius:8px;font-size:.85rem;margin-bottom:12px;display:none}

.header{background:linear-gradient(135deg,#1e3a5f,#0f2440);color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.5rem;font-weight:800}
.header-sub{opacity:.75;font-size:.85rem;margin-top:2px}
.header-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:38px}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-primary{background:var(--primary-light);color:#fff}
.btn-white{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300)}
.btn-sm{padding:5px 10px;min-height:32px;font-size:.8rem}
.btn-link{background:none;border:none;color:var(--primary-light);font-weight:600;cursor:pointer;font-size:.82rem;padding:4px}
.btn-x{background:none;border:none;color:var(--gray-400);font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:6px}
.btn-x:hover{color:var(--danger);background:#fef2f2}
.owner-badge{background:#eef2ff;color:#4338ca;font-size:.72rem;padding:3px 10px;border-radius:12px;font-weight:700}
.pill{font-size:.75rem;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3)}
.pill.err{background:#fecaca;color:#7f1d1d;border-color:#fca5a5}

.tabs{display:flex;gap:4px;padding:0 32px;background:#fff;border-bottom:1px solid var(--gray-200);overflow-x:auto;position:sticky;top:0;z-index:20}
.tab{padding:14px 16px;border:none;background:none;font-size:.92rem;font-weight:700;color:var(--gray-500);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--primary);border-bottom-color:var(--primary-light)}
.tab .sub{display:block;font-size:.68rem;font-weight:600;color:var(--gray-400)}

.dashboard{padding:24px 32px;max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.panel{background:#fff;border-radius:14px;border:1px solid var(--gray-200);padding:20px}
.panel h2{font-size:1.1rem;font-weight:700;color:var(--primary);margin-bottom:4px}
.panel h3{font-size:.95rem;font-weight:700;color:var(--gray-700);margin:14px 0 8px}
.desc{font-size:.85rem;color:var(--gray-500);margin-bottom:14px;line-height:1.5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{padding:8px 12px;border:1px solid var(--gray-300);border-radius:8px;font-size:.9rem;min-height:38px;min-width:220px}
.banner{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d;border-radius:10px;padding:12px 16px;font-size:.88rem}
.banner.info{background:var(--primary-bg);border-color:#bfdbfe;color:#1e3a8a}
.banner.warn{background:var(--amber-bg);border-color:#fcd34d;color:var(--amber)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem}
.flow .st{background:#fff;border:1px solid var(--gray-300);border-radius:8px;padding:6px 10px;font-weight:600}
.flow .st.b{border-color:#fdba74;background:var(--bulk-bg);color:var(--bulk)}
.flow .st.l{border-color:#5eead4;background:var(--line-bg);color:var(--line)}
.flow .ar{color:var(--gray-400)}

.table-box{overflow-x:auto;border:1px solid var(--gray-200);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:.85rem;min-width:560px}
table.t th{text-align:left;font-size:.68rem;text-transform:uppercase;color:var(--gray-700);padding:8px;background:var(--gray-100);border-bottom:1px solid var(--gray-300);font-weight:700;letter-spacing:.3px;white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
table.t tfoot td{font-weight:800;border-top:2px solid var(--gray-300);background:var(--gray-50)}
table.t input,table.t select{width:100%;padding:7px 8px;border:1px solid var(--gray-300);border-radius:7px;font-size:.88rem;min-height:36px;background:#fff}
table.t input[type=number]{text-align:right}
table.t input:focus,table.t select:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
.w-xs{width:70px}.w-s{width:95px}.w-m{width:140px}
.muted{color:var(--gray-400)}
.small{font-size:.78rem}
.warn-t{color:var(--amber);font-size:.75rem;font-weight:600}
.err-t{color:var(--danger);font-size:.75rem;font-weight:600}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gray-100);color:var(--gray-700)}
.tag.stale{background:var(--amber-bg);color:var(--amber)}
.tag.b{background:var(--bulk-bg);color:var(--bulk)}
.tag.l{background:var(--line-bg);color:var(--line)}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-h h2{display:flex;align-items:center;gap:8px}
.card{border:1px solid var(--gray-200);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.card.b{border-left:4px solid #fb923c}
.card.p{border-left:4px solid #a78bfa}
.card.l{border-left:4px solid #2dd4bf}
.card-h{display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.card-h:hover{background:var(--gray-50)}
.card-h .nm{font-weight:700;font-size:.95rem;flex:1 1 200px;min-width:0}
.card-h .nm .s{display:block;font-weight:500;font-size:.78rem;color:var(--gray-500);margin-top:2px}
.kv{display:flex;flex-direction:column;align-items:flex-end;min-width:90px}
.kv .k{font-size:.65rem;text-transform:uppercase;color:var(--gray-500);font-weight:700}
.kv .v{font-weight:800;font-size:.95rem}
.chev{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:var(--gray-100);transition:transform .15s;flex-shrink:0}
.card.open .chev{transform:rotate(90deg)}
.card-b{padding:4px 14px 16px;border-top:1px solid var(--gray-100)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:.68rem;font-weight:700;color:var(--gray-500);text-transform:uppercase}
.ff input,.ff select,.ff textarea{padding:8px 10px;border:1px solid var(--gray-300);border-radius:8px;font-size:.9rem;min-height:38px;width:100%;background:#fff}
.eq{display:flex;align-items:center;gap:6px;font-size:.85rem}
.eq input{width:80px}.eq select,.eq .u{min-width:70px}
.totals{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tot{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:10px 14px;min-width:130px}
.tot .k{font-size:.66rem;text-transform:uppercase;color:var(--gray-500);font-weight:700}
.tot .v{font-size:1.1rem;font-weight:800;margin-top:2px}
.tot.hi{background:var(--primary-bg);border-color:#bfdbfe}
.tot.hi .v{color:var(--primary)}
.card-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--gray-300);background:#fff;border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer;color:var(--gray-700)}
.chip:hover{border-color:var(--primary-light);color:var(--primary-light)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:14px 16px}
.stat .k{font-size:.7rem;text-transform:uppercase;color:var(--gray-500);font-weight:700}
.stat .v{font-size:1.5rem;font-weight:800;margin-top:4px}
.stat .s{font-size:.78rem;color:var(--gray-500);margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--gray-300);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--gray-700)}
.seg button.on{background:var(--primary);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal h3{color:var(--primary)}
.modal textarea{width:100%;min-height:200px;padding:10px;border:1px solid var(--gray-300);border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:8px;font-size:.9rem;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
#printArea{display:none}
@media(max-width:768px){.header{padding:14px 16px}.dashboard{padding:14px}.panel{padding:14px}.tabs{padding:0 8px}.kv{min-width:70px}}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important}
  body{background:#fff}
}
.inv{font-size:12pt;color:#000;padding:10px}
.inv h1{font-size:20pt;margin-bottom:4px}
.inv .row{display:flex;justify-content:space-between;gap:20px;margin:14px 0}
.inv table{width:100%;border-collapse:collapse;margin-top:10px}
.inv th,.inv td{border-bottom:1px solid #ccc;padding:6px;text-align:left}
.inv td.num,.inv th.num{text-align:right}
.inv tfoot td{font-weight:800;border-top:2px solid #000}
.inv .note{font-size:9pt;color:#444;margin-top:14px;line-height:1.5}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>Food Cost</h2>
    <p>Owner sign in</p>
    <div class="login-error" id="loginError"></div>
    <input type="text" id="loginEmail" placeholder="Email" autocapitalize="none" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Password" onkeydown="if(event.key==='Enter')handleLogin()">
    <button onclick="handleLogin()">Sign In</button>
  </div>
</div>

<div class="header">
  <div>
    <h1>🧮 Food Cost <span class="owner-badge">Owner Only</span></h1>
    <div class="header-sub">What every bulk batch and menu dish costs to make.</div>
  </div>
  <div class="header-right">
    <span class="pill" id="savePill">Loading…</span>
    <a class="btn btn-ghost" href="index.html">← Central Command</a>
    <button class="btn btn-ghost" onclick="auth.signOut()">Sign Out</button>
  </div>
</div>

<nav class="tabs" id="tabs"></nav>
<main class="dashboard" id="content"><div class="panel desc">Loading…</div></main>
<div id="modalRoot"></div>
<div id="printArea"></div>
<div id="toast"></div>

<script src="shared.js?v=20261029"></script>
<script>
// ============================================================================
// food-cost.html — Food Cost (owner only). Added Nov 1 2026.
//
// Cost chain:  Ingredients -> Prep (any location) -> Bulk batch (Renton) -> per tray
//              -> Line dish (bulk portion + extra ingredients + line labor)
// Monthly billing:
//   Renton -> Issaquah: trays (daily.html units) delivered or used x bulk cost per unit
//   Issaquah -> Renton: chicken prep from chicken-prep-log (raw chicken + logged labor)
//
// Firestore (OWNER ONLY in firestore.rules):
//   food_cost/catalog            { rev, ingredients[], prep[], bulk[], menu[], settings{} }
//   food_cost_invoices/{YYYY-MM} { opts, manual{}, snapshots[] }
// Reads (already allowed for owner): config/settings (daily items + pars), days/*,
//   chicken-prep/nnc-iss/records/*, delivery_config/rates (staff wages).
// The catalog is saved with a revision check so two open tabs can't silently
// overwrite each other.
// ============================================================================

const LOCS = { 'nnc-iss': 'Issaquah', 'nnc-renton': 'Renton', 'babas-bel': 'Bellevue' };
// Families: w = weight (in lb), v = volume (in fl oz), c = count (in each). Same-family units convert automatically.
const UNITS = {
  lb: ['w', 1], oz: ['w', 1 / 16], kg: ['w', 2.20462262], g: ['w', 0.00220462262], mg: ['w', 0.00000220462262],
  gal: ['v', 128], qt: ['v', 32], pt: ['v', 16], cup: ['v', 8], 'fl oz': ['v', 1], tbsp: ['v', 0.5], tsp: ['v', 1 / 6],
  l: ['v', 33.8140227], ml: ['v', 0.0338140227], dash: ['v', 1 / 48], pinch: ['v', 1 / 96],
  each: ['c', 1], dozen: ['c', 12],
  in: ['len', 1], ft: ['len', 12], yd: ['len', 36], cm: ['len', 0.393700787], m: ['len', 39.3700787]
};
const UNIT_LABELS = { g: 'gram', kg: 'kg', mg: 'mg', lb: 'lbs', oz: 'oz', ml: 'mL', l: 'L', 'fl oz': 'fl oz', cup: 'cup', tbsp: 'tbsp', tsp: 'tsp', pinch: 'pinch', dash: 'dash', gal: 'gallon', qt: 'quart', pt: 'pint', each: 'each', dozen: 'dozen', in: 'inch', ft: 'feet', yd: 'yard', cm: 'cm', m: 'meter' };
const UNIT_GROUPS = [['Weight', ['g', 'kg', 'oz', 'lb', 'mg']], ['Volume', ['tsp', 'tbsp', 'fl oz', 'cup', 'pt', 'qt', 'gal', 'ml', 'l', 'pinch', 'dash']], ['Count', ['each', 'dozen']], ['Length', ['in', 'ft', 'yd', 'cm', 'm']]];
// <option>s grouped Weight / Volume / Count; `only` limits to those units; an unknown current value is kept
function unitOptionsHtml(val, only) {
  const v = nu(val); let found = false;
  const groups = UNIT_GROUPS.map(([g, us]) => { const list = us.filter(u => !only || only.includes(u)); if (!list.length) return ''; return `<optgroup label="${g}">${list.map(u => { if (u === v) found = true; return `<option value="${esc(u)}"${u === v ? ' selected' : ''}>${esc(UNIT_LABELS[u] || u)}</option>`; }).join('')}</optgroup>`; }).join('');
  const extra = (only || []).filter(u => !UNITS[u]);
  const extraHtml = extra.length ? `<optgroup label="Portions and other">${extra.map(u => { if (u === v) found = true; return `<option value="${esc(u)}"${u === v ? ' selected' : ''}>${esc(u)}</option>`; }).join('')}</optgroup>` : '';
  return groups + extraHtml + (v && !found ? `<option value="${esc(v)}" selected>${esc(v)}</option>` : '');
}
const UNIT_ALIASES = { lbs: 'lb', pound: 'lb', pounds: 'lb', ounce: 'oz', ounces: 'oz', gallon: 'gal', gallons: 'gal', quart: 'qt', quarts: 'qt', pint: 'pt', pints: 'pt', cups: 'cup', floz: 'fl oz', 'fl. oz': 'fl oz', tablespoon: 'tbsp', tablespoons: 'tbsp', teaspoon: 'tsp', teaspoons: 'tsp', liter: 'l', litre: 'l', liters: 'l', gram: 'g', grams: 'g', kilogram: 'kg', kgs: 'kg', trays: 'tray', containers: 'container', cases: 'case', ea: 'each', pcs: 'each', pc: 'each', piece: 'each', pieces: 'each', dz: 'dozen', doz: 'dozen', inch: 'in', inches: 'in', feet: 'ft', foot: 'ft', yard: 'yd', yards: 'yd', meter: 'm', meters: 'm', pinches: 'pinch', dashes: 'dash', milligram: 'mg', milligrams: 'mg', ml: 'ml', mls: 'ml', milliliter: 'ml', milliliters: 'ml', 'fluid ounce': 'fl oz', 'fluid ounces': 'fl oz', bags: 'bag', bottles: 'bottle', bunches: 'bunch', batches: 'batch' };
const UNIT_SUGGEST = ['lb', 'oz', 'g', 'kg', 'mg', 'gal', 'qt', 'pt', 'cup', 'fl oz', 'tbsp', 'tsp', 'l', 'ml', 'pinch', 'dash', 'each', 'dozen', 'tray', 'half tray', 'container', 'case', 'bag', 'bunch', 'bottle', 'batch'];
const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const STALE_DAYS = 90;
// Bulk Cooking list = kitchen items on the Daily Order (minus BULK_SKIP_DAILY) + BULK_EXTRAS.
// Edit these two lists to change what "Add all" offers. Units are the batch yield unit (editable per item).
const BULK_SKIP_DAILY = ['milk'];                      // bought, not cooked
// Daily Order items that belong in Bulk Raw Inputs instead of Bulk Cooking (daily order id -> section)
const DAILY_RAW_GROUP = { 'yogurt': 'input', 'tandoori-sauce': 'input' };
const BULK_EXTRAS = [                                   // made in bulk but not on the Daily Order (group spice/meat/input = Bulk Raw Inputs tab)
  { name: 'Chicken Seekh Kabab', unit: 'each' },
  { name: 'Lamb Seekh Kabab', unit: 'each' },
  { name: 'Beef Seekh Kabab', unit: 'each' },
  { name: 'Achari Boti', unit: 'lb' },
  { name: 'Bihari Kabab', unit: 'lb' },
  { name: 'Broast', unit: 'each' },
  { name: 'Nehari Beef', unit: 'tray' },
  { name: 'Haleem', unit: 'tray' },
  { name: 'Garam Masala', unit: 'lb', group: 'spice' },    // Bulk Raw Inputs > Spices
  { name: 'Nehari Masala', unit: 'lb', group: 'spice' },
  { name: 'Lamb Cut + Wash', unit: 'lb', group: 'meat' },   // Bulk Raw Inputs > Prepped Meat
  { name: 'Chicken Korma Cut + Washed', unit: 'lb', group: 'meat', location: 'nnc-iss' },
  { name: 'Ginger/Garlic Paste', unit: 'lb', group: 'input' } // Bulk Raw Inputs > Inputs
];
// Bulk Raw Inputs sub-sections (bulk items with these groups); anything else is Bulk Cooking
const RAW_GROUPS = [['spice', 'Spices', 'Spice mixes roasted and ground in house (garam masala, nehari masala).'],
  ['meat', 'Prepped Meat', 'Meat cut, cleaned and washed before cooking. Often done at a restaurant and sent to Renton.'],
  ['input', 'Inputs', 'Other things made ahead and used in recipes, like ginger/garlic paste.']];
function isRaw(it) { return RAW_GROUPS.some(g => g[0] === it.group); }
function rawLabel(g) { const f = RAW_GROUPS.find(x => x[0] === g); return f ? f[1] : ''; }
// Main kitchen spices for the Ingredients tab: read live from the Weekly Main Kitchen
// Inventory (inventory_config/frozen_nnc-iss, subCategory 'spices'); this list is the fallback.
// Skipped: ones made in house as Bulk Spices (garam masala).
const MK_SPICE_SKIP = ['mk-garam-masala-ground'];
const MK_SPICES_DEFAULT = ['Chaat Masala (case)', 'Methi (5lb container)', 'Cumin (gallon ziploc)', 'Green Cardamom (gallon ziploc)', 'Black Cardamom (gallon ziploc)', 'Garam Masala Ground (large nido)', 'Bay Leaf (gallon ziploc)', 'Cinnamon Stick (gallon ziploc)', 'Cloves (gallon ziploc)', 'Black Pepper - Whole (gallon ziploc)', 'Black Pepper Crush - Karahi (gallon ziploc)', 'Coriander Crush - Karahi (gallon ziploc)', 'Coriander Powder - Handi (gallon ziploc)', 'Fennel Seed Crush - Handi (gallon ziploc)', 'Fennel Seed Whole (5 lb container)', 'Ground Almond - Mughlai (gallon ziploc)', 'Ground Pistachio (gallon ziploc)', 'Achaar Powder (gallon ziploc)', 'Anaar Dana (16 oz black container)', 'Rice Whole Garam Masala']
  .map(n => ({ id: n === 'Garam Masala Ground (large nido)' ? 'mk-garam-masala-ground' : '', name: n }));

async function saveCatalog() {
  clearTimeout(saveTimer);

  if (saving) { saveAgain = true; return; }
  saving = true; dirty = false;
  const ref = db.collection('food_cost').doc('catalog');
  try {
    const data = JSON.parse(JSON.stringify(C));
    await db.runTransaction(async tx => {
      const s = await tx.get(ref);
      const cur = s.exists ? (s.data().rev || 0) : 0;
      if (cur !== loadedRev) throw new Error('CONFLICT');
      data.rev = cur + 1;
      data.updatedAt = new Date().toISOString();
      data.updatedBy = (auth.currentUser && auth.currentUser.email) || '';
      tx.set(ref, data);
    });
    loadedRev++;

    if (e.message === 'CONFLICT') {

// paste import
function openPaste() {
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Paste ingredients from a spreadsheet</h3>
    <p class="desc" style="margin:0">Copy rows from Excel or Google Sheets and paste below. Columns in this order: <b>Name, Pack qty, Unit, Pack price, Vendor, Category, Brand</b> (vendor, category and brand optional). A header row is skipped. If a name already exists, its price is updated instead of adding a duplicate.</p>
    <textarea id="pasteBox" placeholder="Chicken thigh boneless	40	lb	96.00	Sysco	Meat"></textarea>
    <div id="pastePrev" class="small muted"></div>
    <div class="card-actions"><button class="btn btn-white" onclick="closeModal()">Cancel</button><button class="btn btn-white" onclick="previewPaste()">Preview</button><button class="btn btn-primary" onclick="applyPaste()">Import</button></div>
  </div></div>`;
  setTimeout(() => document.getElementById('pasteBox').focus(), 30);
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function parsePaste() {
  const txt = document.getElementById('pasteBox').value;
  const rows = [];
  txt.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const c = (line.includes('\t') ? line.split('\t') : line.split(',')).map(x => x.trim());
    const qty = Number(String(c[1] || '').replace(/[^0-9.]/g, ''));
    const price = Number(String(c[3] || '').replace(/[^0-9.\-]/g, ''));
    if (!c[0] || (!qty && !price)) return; // header or junk
    rows.push({ name: c[0], packQty: qty || '', packUnit: nu(c[2] || 'lb'), packPrice: isNaN(price) ? '' : price, vendor: c[4] || '', category: c[5] || '', brand: c[6] || '' });
  });
  return rows;
}
function previewPaste() {
  const rows = parsePaste();
  const upd = rows.filter(r => C.ingredients.some(i => i.name.toLowerCase() === r.name.toLowerCase() && (!r.brand || (i.brand || '').toLowerCase() === r.brand.toLowerCase()))).length;
  document.getElementById('pastePrev').innerHTML = rows.length ? `${rows.length} rows read: ${rows.length - upd} new, ${upd} price updates. First: <b>${esc(rows[0].name)}</b> ${rows[0].packQty} ${esc(rows[0].packUnit)} for ${money(rows[0].packPrice)}` : 'Nothing readable yet.';
}
function applyPaste() {
  const rows = parsePaste(); if (!rows.length) { previewPaste(); return; }
  const today = dk(new Date());
  rows.forEach(r => {
    // same name + same brand = update; a different brand of the same item is its own ingredient
    const ex = C.ingredients.find(i => i.name.toLowerCase() === r.name.toLowerCase() && (!r.brand || (i.brand || '').toLowerCase() === r.brand.toLowerCase()));
    if (ex) {
      if (r.packPrice !== '' && r.packPrice !== ex.packPrice) { ex.prevPrice = ex.packPrice; ex.packPrice = r.packPrice; ex.priceDate = today; }
      if (r.packQty) { ex.packQty = r.packQty; ex.caseCount = 1; ex.innerQty = r.packQty; } if (r.packUnit) ex.packUnit = r.packUnit;
      if (r.vendor) ex.vendor = r.vendor; if (r.category) ex.category = r.category; if (r.brand) ex.brand = r.brand;
    } else C.ingredients.push(Object.assign({ id: newId(), notes: '', priceDate: r.packPrice !== '' ? today : '' }, r));
  });
  C.ingredients.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  closeModal(); queueSave(); render(); toast(`Imported ${rows.length} rows`);
}

// ---- Yield (cooked weights) for Bulk Cooking batches ----

  return `<div class="panel">

// menu paste import: Name, Category, Price (tab or comma separated)
function openMenuPaste() {
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Paste menu items</h3>
    <p class="desc" style="margin:0">One dish per line: <b>Name, Category, Price</b> (category and price optional). Paste from a spreadsheet or a list Claude made from your menu. If a dish name already exists, its category and price are updated instead of adding a duplicate. Recipes are added afterwards on each dish.</p>
    <textarea id="menuPasteBox" placeholder="Chicken Karahi	Curry	19.99"></textarea>
    <div id="menuPastePrev" class="small muted"></div>
    <div class="card-actions"><button class="btn btn-white" onclick="closeModal()">Cancel</button><button class="btn btn-white" onclick="previewMenuPaste()">Preview</button><button class="btn btn-primary" onclick="applyMenuPaste()">Import</button></div>
  </div></div>`;
  setTimeout(() => document.getElementById('menuPasteBox').focus(), 30);
}
function parseMenuPaste() {
  const rows = [];
  document.getElementById('menuPasteBox').value.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const c = (line.includes('\t') ? line.split('\t') : line.split(',')).map(x => x.trim());
    const name = c[0]; if (!name || /^(name|dish|item)$/i.test(name)) return;
    const price = Number(String(c[2] || '').replace(/[^0-9.]/g, ''));
    rows.push({ name, category: c[1] || '', price: price > 0 ? price : '' });
  });
  return rows;
}
function previewMenuPaste() {
  const rows = parseMenuPaste();
  const upd = rows.filter(r => C.menu.some(m => (m.name || '').toLowerCase() === r.name.toLowerCase())).length;
  document.getElementById('menuPastePrev').innerHTML = rows.length ? `${rows.length} dishes read: ${rows.length - upd} new, ${upd} updates. First: <b>${esc(rows[0].name)}</b>${rows[0].category ? ' (' + esc(rows[0].category) + ')' : ''} ${rows[0].price !== '' ? money(rows[0].price) : ''}` : 'Nothing readable yet.';
}
function applyMenuPaste() {
  const rows = parseMenuPaste(); if (!rows.length) { previewMenuPaste(); return; }
  rows.forEach(r => {
    const ex = C.menu.find(m => (m.name || '').toLowerCase() === r.name.toLowerCase());
    if (ex) { if (r.category) ex.category = r.category; if (r.price !== '') ex.price = r.price; }
    else C.menu.push({ id: newId(), name: r.name, category: r.category, location: 'nnc-iss', price: r.price, lines: [], labor: [], notes: '' });
  });
  closeModal(); queueSave(); render(); toast(`Imported ${rows.length} dishes`);
}

// ===== QUARTERLY PRICING + MARKUP =====
// C.pricing['2026-Q4'] = { defaultMarkup, items: { <bulkId>: { markupPct, lockedCost, lockedPrice } },
//                          locked, lockedAt, lockedBy, notes }
// While a quarter is open, prices follow today's recipe cost. Locking freezes cost and price
// for the quarter so recipe or ingredient changes mid-quarter don't move what restaurants pay.
function qKey(d) { return d.getFullYear() + '-Q' + (Math.floor(d.getMonth() / 3) + 1); }
function qShift(k, by) { const [y, q] = k.split('-Q').map(Number); const i = y * 4 + (q - 1) + by; return Math.floor(i / 4) + '-Q' + (i % 4 + 1); }
function qLabel(k) { const [y, q] = k.split('-Q').map(Number); const m = ['Jan–Mar', 'Apr–Jun', 'Jul–Sep', 'Oct–Dec'][q - 1]; return `Q${q} ${y} (${m})`; }
function prevQuarterWith(k) { for (let i = 1; i <= 12; i++) { const p = qShift(k, -i); if (C.pricing[p]) return p; } return null; }
function markupOf(Q, id) { const v = n(((Q.items || {})[id] || {}).markupPct); if (!isNaN(v)) return v; const d = n(Q.defaultMarkup); return isNaN(d) ? 0 : d; }
function startQuarter(k) {
  const prev = prevQuarterWith(k);
  const P = prev ? C.pricing[prev] : null;
  const items = {};
  if (P) Object.entries(P.items || {}).forEach(([id, v]) => { if (v && v.markupPct !== '' && v.markupPct != null) items[id] = { markupPct: v.markupPct }; });
  C.pricing[k] = { defaultMarkup: P ? P.defaultMarkup : 10, items, locked: false, notes: '' };
  queueSave(); render();
  if (P) toast('Markups copied from ' + qLabel(prev));
}
function lockQuarter(k) {
  const Q = C.pricing[k]; if (!Q) return;
  if (!confirmInline('lock-' + k)) return;
  Q.items = Q.items || {};
  let missing = 0;
  C.bulk.forEach(b => {
    const cost = batchCost(b).perUnit; const m = markupOf(Q, b.id);
    const row = Q.items[b.id] = Object.assign({}, Q.items[b.id] || {});
    if (cost == null || !(b.lines.length || b.labor.length)) { row.lockedCost = null; row.lockedPrice = null; missing++; }
    else { row.lockedCost = r4(cost); row.lockedPrice = r4(cost * (1 + m / 100)); row.lockedMarkup = m; }
    row.unit = nu(b.yieldUnit);
  });
  Q.locked = true; Q.lockedAt = new Date().toISOString(); Q.lockedBy = (auth.currentUser && auth.currentUser.email) || '';
  queueSave(); render(); toast(`${qLabel(k)} prices locked${missing ? ` (${missing} items have no cost yet)` : ''}`);
}
function unlockQuarter(k) {
  const Q = C.pricing[k]; if (!Q) return;
  if (!confirmInline('unlock-' + k)) return;
  Q.locked = false; Q.unlockedAt = new Date().toISOString(); queueSave(); render();
}
function r4(v) { return Math.round(v * 10000) / 10000; }
function pricingQuarterNav(k) { pricingQ = k; render(); }
function applyDefaultToAll(k) {
  const Q = C.pricing[k]; if (!Q || Q.locked) return;
  if (!confirmInline('def-' + k)) return;
  Object.values(Q.items || {}).forEach(v => { v.markupPct = ''; });
  queueSave(); render(); toast('Every item now uses the default markup');
}
function renderPricing() {
  const k = pricingQ || qKey(new Date());
  const Q = C.pricing[k];
  const cur = qKey(new Date());
  const nav = `<div class="toolbar" style="margin:0"><button class="btn btn-white btn-sm" onclick="pricingQuarterNav('${qShift(k, -1)}')">‹</button><span style="font-weight:700;min-width:170px;text-align:center">${qLabel(k)}${k === cur ? ' <span class="tag">current</span>' : ''}</span><button class="btn btn-white btn-sm" onclick="pricingQuarterNav('${qShift(k, 1)}')">›</button></div>`;
  const head = `<div class="sec-h"><h2>Quarterly Pricing + Markup</h2><div class="toolbar" style="margin:0">${sortCtl('price')}${nav}</div></div>
    <p class="desc">What Renton charges each restaurant for bulk items and raw inputs, set once a quarter. Cost per unit comes from the recipes. Pick a markup for each item (or leave it blank to use the default), check the price, then lock the quarter. Locking freezes cost and price until next quarter, so recipe or ingredient changes mid-quarter don't move what restaurants pay. Every restaurant pays the same price.</p>`;
  if (!Q) {
    const prev = prevQuarterWith(k);
    return `<div class="panel">${head}<div class="banner info">No pricing set for ${qLabel(k)} yet. <button class="btn btn-primary btn-sm" style="margin-left:8px" onclick="startQuarter('${k}')">Start ${qLabel(k).split(' (')[0]} pricing</button>${prev ? ` <span class="small">Markups will be copied from ${qLabel(prev)}.</span>` : ''}</div></div>`;
  }
  const P = C.pricing[prevQuarterWith(k)] || null;
  const L = !!Q.locked;
  const row = b => {
    const c = batchCost(b); const has = b.lines.length || b.labor.length;
    const costNow = has ? c.perUnit : null;
    const it = (Q.items || {})[b.id] || {};
    const m = markupOf(Q, b.id);
    const cost = L ? it.lockedCost : costNow;
    const price = L ? it.lockedPrice : (costNow == null ? null : costNow * (1 + m / 100));
    const prevPrice = P && P.locked && P.items && P.items[b.id] ? P.items[b.id].lockedPrice : null;
    const chg = prevPrice > 0 && price != null ? price / prevPrice - 1 : null;
    const drift = L && it.lockedCost > 0 && costNow != null ? costNow / it.lockedCost - 1 : null;
    const u = esc(nu(b.yieldUnit) || 'unit');
    return `<tr>
      <td><b>${esc(b.name || '(unnamed)')}</b>${has ? '' : '<div class="warn-t">No recipe yet</div>'}</td>
      <td>${u}</td>
      <td class="num">${money4(cost)}${drift != null && Math.abs(drift) >= 0.005 ? `<div class="${drift > 0 ? 'err-t' : 'muted small'}">now ${money4(costNow)} (${drift > 0 ? '+' : ''}${(drift * 100).toFixed(1)}%)</div>` : ''}</td>
      <td class="w-s">${L ? `<span>${fmt(it.lockedMarkup != null ? it.lockedMarkup : m, 1)}%</span>` : inp(`pricing.${k}.items.${b.id}.markupPct`, it.markupPct, { num: true, ph: fmt(n(Q.defaultMarkup) || 0, 1) })}</td>
      <td class="num">${price == null ? '—' : money(price - cost)}</td>
      <td class="num"><b>${money4(price)}</b><div class="muted small">per ${u}</div></td>
      <td class="num">${prevPrice != null ? money4(prevPrice) : '<span class="muted small">—</span>'}</td>
      <td class="num">${chg == null ? '<span class="muted small">—</span>' : `<span class="${chg > 0 ? 'err-t' : 'muted small'}" style="font-size:.85rem">${chg > 0 ? '+' : ''}${(chg * 100).toFixed(1)}%</span>`}</td>
    </tr>`;
  };

function monthRange(m) { const [y, mo] = m.split('-').map(Number); const first = new Date(y, mo - 1, 1); const last = new Date(y, mo, 0); return { first, last }; }
function getPar(item, date) { const dn = DAYS[date.getDay()]; return (item.par && item.par[dn]) || 0; }
function snapToStep(val, step) { if (!step || step <= 0) return val; if (val <= 0) return 0; return Math.ceil(val / step) * step; }
// Same rule as daily.html calcNormalOrder
function calcNormalOrder(item, pm, date, sunOn) {
  if (date.getDay() === 0 && !sunOn && item.category === 'kitchen') return 0;
  const nextPar = getPar(item, addDays(date, 1));
  return snapToStep(Math.max(0, nextPar - Number(pm)), item.orderStep || 0.5);
}
function hasVal(v) { return !(v === undefined || v === null || v === ''); }
// Delivered on day D = what was ordered the night before (daily.html amFromPrevDay minus PM)
function deliveredOn(item, D, days) {
  const prev = addDays(D, -1);
  const pDay = days[dk(prev)] || {}; const pd = pDay[item.id] || {};
  const sunOn = !!(pDay.__meta && pDay.__meta.sundayOrders);
  if (prev.getDay() === 0 && !sunOn && item.category === 'kitchen') return { qty: 0 };
  const extra = pd.extraOrder ? Number(pd.extraOrder) || 0 : 0;
  let normal = null;
  if (pd.manualOrder === true && hasVal(pd.normalOrder)) normal = Number(pd.normalOrder);
  else if (hasVal(pd.pm)) normal = calcNormalOrder(item, Number(pd.pm), prev, sunOn) || 0;
  if (normal === null) return { qty: extra, missing: true };
  return { qty: r2(normal + extra) };
}
function usedOn(item, D, days) {
  const d = (days[dk(D)] || {})[item.id] || {};
  if (!hasVal(d.pm)) return { qty: 0, missing: true };
  const prevPm = ((days[dk(addDays(D, -1))] || {})[item.id] || {}).pm;
  let am = null;
  if (hasVal(prevPm)) am = deliveredOn(item, D, days).qty + Number(prevPm);
  else if (hasVal(d.am)) am = Number(d.am);
  if (am === null) return { qty: 0, missing: true };
  return { qty: r2(am - Number(d.pm)) };
}
async function loadMonth(m, force) {
  if (BILL[m] && !force) return BILL[m];
  const { first, last } = monthRange(m);
  const startKey = dk(addDays(first, -1)), endKey = dk(last);
  const FP = firebase.firestore.FieldPath.documentId();
  const out = { days: {}, chicken: {}, invoice: null, loadedAt: new Date(), errors: [] };
  await Promise.all([
    db.collection('days').where(FP, '>=', startKey).where(FP, '<=', endKey).get()
      .then(s => s.forEach(d => { out.days[d.id] = d.data(); })).catch(e => out.errors.push('Daily order: ' + (e.code || e.message))),
    db.collection('chicken-prep').doc('nnc-iss').collection('records').where(FP, '>=', dk(first)).where(FP, '<=', endKey).get()
      .then(s => s.forEach(d => { out.chicken[d.id] = d.data(); })).catch(e => out.errors.push('Chicken prep log: ' + (e.code || e.message))),
    db.collection('food_cost_invoices').doc(m).get()
      .then(s => { out.invoice = s.exists ? s.data() : null; }).catch(e => out.errors.push('Saved invoices: ' + (e.code || e.message)))
  ]);
  BILL[m] = out;
  return out;
}
function defaultInvoice(m) { return { month: m, opts: { basis: 'delivered', chickenBasis: 'actual', includeKorma: true, includeClean: false }, manual: { rentonToIss: [], issToRenton: [] }, snapshots: [] }; }
// ---- transport: average delivery cost per route, same math as delivery-data.html calc() ----
function vanPerMile(v) { const r = vanRates[v]; const b = r && !isNaN(n(r.base)) ? n(r.base) : IRS_RATE; const a = r && !isNaN(n(r.addon)) ? n(r.addon) : 0; return b + a; }
function tripCost(run) {
  const s = run.stamps || {}; const t = k => (s[k] && s[k].t) || null;
  const start = t('shiftStart'), end = t('shiftEnd');
  const minutes = start && end ? (end - start) / 60000 : null;
  const miles = run.odoStart != null && run.odoEnd != null ? run.odoEnd - run.odoStart : null;
  const dr = staffRate(run.driverName); const hr = run.helperName ? staffRate(run.helperName) : 0;
  if (minutes == null || miles == null || dr == null || hr == null) return null;
  return { total: minutes / 60 * (dr + hr) + miles * vanPerMile(run.vehicle), minutes, miles };
}
function routeKey(a, b) { return (a || '?') + ' → ' + (b || '?'); }
async function loadRouteStats() {
  const days = n(C.settings.transportDays) > 0 ? n(C.settings.transportDays) : 90;
  const from = dk(addDays(new Date(), -days));
  routeStats = {}; routeLoadErr = '';
  try {
    const snap = await db.collection('deliveries').where('date', '>=', from).get();
    const acc = {};
    snap.forEach(d => {
      const r = d.data(); if (r.status === 'open') return;
      const k = routeKey(r.origin, r.dest); const a = acc[k] = acc[k] || { trips: 0, skipped: 0, sum: 0, min: 0, mi: 0 };
      const c = tripCost(r); if (!c) { a.skipped++; return; }
      a.trips++; a.sum += c.total; a.min += c.minutes; a.mi += c.miles;
    });
    Object.entries(acc).forEach(([k, a]) => { routeStats[k] = { trips: a.trips, skipped: a.skipped, avg: a.trips ? a.sum / a.trips : null, avgMin: a.trips ? a.min / a.trips : null, avgMiles: a.trips ? a.mi / a.trips : null }; });
  } catch (e) { console.warn('deliveries', e); routeLoadErr = e.code || e.message; }
}
function tripAvg(l) { const o = n(l.rate); if (!isNaN(o)) return o; const st = routeStats[l.route]; return st && st.avg != null ? st.avg : null; }
function transportCost(l) { const sh = n(l.share); const a = tripAvg(l); return isNaN(sh) || a == null ? 0 : a * sh / 100; }
async function refreshRoutes() { await loadRouteStats(); render(); toast('Delivery costs refreshed'); }
function staffRate(name) { const r = staffRates[name]; if (!r) return null; const w = n(r.wage); if (isNaN(w)) return null; const l = n(r.load); return w * (1 + (isNaN(l) ? 0 : l) / 100); }

function calcRentonToIss(m, data) {
  const { first, last } = monthRange(m);
  const mk = 1 + (n(C.settings.markupPct) || 0) / 100;
  const basis = INV.opts.basis;
  const rows = [], skipped = [];
  dailyItems.forEach(di => {
    const b = C.bulk.find(x => x.dailyId === di.id);
    let del = 0, use = 0, missDel = 0, missUse = 0;
    for (let D = new Date(first); D <= last; D = addDays(D, 1)) {
      const a = deliveredOn(di, D, data.days); del += a.qty; if (a.missing) missDel++;
      const u = usedOn(di, D, data.days); use += u.qty; if (u.missing) missUse++;
    }
    del = r2(del); use = r2(use);
    if (!b) { if (del || use) skipped.push({ name: di.name, unit: di.unit, del, use }); return; }
    const qty = basis === 'used' ? use : del;
    const unitCost = costPer('bulk:' + b.id, di.unit);
    const ui = unitInfo('bulk:' + b.id);
    const why = unitCost != null ? '' : (ui.cost == null ? 'No cost yet: finish the recipe and batch size' : `Recipe is per ${ui.base} but the daily order counts ${di.unit}. Fix the unit on the bulk item.`);
    rows.push({ name: b.name, unit: di.unit, del, use, qty, unitCost: unitCost == null ? null : unitCost * mk, amount: unitCost == null ? 0 : qty * unitCost * mk, missDel, missUse, noCost: why });
  });
  INV.manual.rentonToIss.forEach(l => { const q = n(l.qty), p = n(l.price); rows.push({ manual: true, name: l.desc || 'Other', unit: l.unit || '', qty: isNaN(q) ? 0 : q, unitCost: isNaN(p) ? 0 : p, amount: (isNaN(q) ? 0 : q) * (isNaN(p) ? 0 : p) }); });
  const total = rows.reduce((s, r) => s + r.amount, 0);
  return { rows, skipped, total };
}
function calcIssToRenton(m, data) {
  const mk = 1 + (n(C.settings.markupPct) || 0) / 100;
  const rawPerLb = C.settings.rawChickenIng ? costPer(C.settings.rawChickenIng, 'lb') : null;
  const issRate = n(C.settings.laborRates['nnc-iss']);
  const defaultRateUsed = new Set();
  const kinds = [
    { key: 'chicken-korma', task: 'cutting', label: 'Chicken cut for korma', inc: INV.opts.includeKorma,
      raw: r => n(r.weight_full_cases) || (n(r.cases_opened) || 0) * 40, out: r => (n(r.weight_15lb_bags) || 0) + (n(r.weight_non_15lb) || 0) + (n(r.weight_small_pieces) || 0) },
    { key: 'chicken-clean', task: 'cleaning', label: 'Chicken cleaned', inc: INV.opts.includeClean,
      raw: r => (n(r.cleaned_cases) || 0) * 40, out: r => (n(r.cleaned_weight) || 0) + (n(r.cleaned_small_pieces) || 0) }
  ];
  const rows = [];
  kinds.forEach(k => {
    let raw = 0, out = 0, labor = 0, mins = 0, estDays = 0, days = 0;
    const std = C.prep.find(p => p.logSource === k.key);
    const stdPerLb = std ? costPer('prep:' + std.id, 'lb') : null;
    // labor $ per lb produced, from the prep recipe (used only for days with no logged sessions)
    const stdLaborPerLb = (() => {
      if (!std) return null; const y = n(std.yieldQty); if (!(y > 0)) return null;
      const basePerLb = toBase(1, 'lb', nu(std.yieldUnit), altOf(std)); if (!basePerLb) return null;
      return batchCost(std).lab / (y / basePerLb);
    })();
    Object.entries(data.chicken).forEach(([date, r]) => {
      const rr = k.raw(r) || 0, oo = k.out(r) || 0; if (!rr && !oo) return;
      days++; raw += rr; out += oo;
      const sess = (r.sessions || []).filter(s => s.status !== 'open' && s.task === k.task && n(s.minutes) > 0);
      if (sess.length) {
        sess.forEach(s => {
          const staff = (s.staff && s.staff.length) ? s.staff : ['(unnamed)'];
          staff.forEach(name => {
            let rate = staffRate(name);
            if (rate == null) { rate = isNaN(issRate) ? 0 : issRate; defaultRateUsed.add(name); }
            labor += n(s.minutes) / 60 * rate; mins += n(s.minutes);
          });
        });
      } else { estDays++; if (stdLaborPerLb != null) labor += oo * stdLaborPerLb; }
    });
    const rawCost = rawPerLb == null ? null : raw * rawPerLb;
    const actual = rawCost == null ? null : rawCost + labor;
    const standard = stdPerLb == null ? null : out * stdPerLb;
    const amountBase = INV.opts.chickenBasis === 'standard' ? standard : actual;
    rows.push({ key: k.key, label: k.label, inc: k.inc, days, raw: r2(raw), out: r2(out), yieldPct: raw ? out / raw : null, rawCost, labor, mins, estDays, actual, standard, std, amount: k.inc && amountBase != null ? amountBase * mk : 0, missingPrice: amountBase == null });
  });
  const manual = INV.manual.issToRenton.map(l => { const q = n(l.qty), p = n(l.price); return { name: l.desc || 'Other', unit: l.unit || '', qty: isNaN(q) ? 0 : q, unitCost: isNaN(p) ? 0 : p, amount: (isNaN(q) ? 0 : q) * (isNaN(p) ? 0 : p) }; });
  const total = rows.reduce((s, r) => s + r.amount, 0) + manual.reduce((s, r) => s + r.amount, 0);
  return { rows, manual, total, rawPerLb, defaultRateUsed: [...defaultRateUsed] };
}

  <div class="panel">
    <div class="sec-h"><h2>Renton → Issaquah: bulk food</h2>
      <div class="toolbar" style="margin:0"><span class="small muted">Bill on</span><div class="seg"><button class="${INV.opts.basis === 'delivered' ? 'on' : ''}" onclick="setInvOpt('basis','delivered')">Delivered</button><button class="${INV.opts.basis === 'used' ? 'on' : ''}" onclick="setInvOpt('basis','used')">Used</button></div><button class="btn btn-white btn-sm" onclick="printInvoice('A')">Print invoice</button></div></div>
    <p class="desc">Delivered = what Issaquah ordered the night before (Order + Extra on the Daily Order). Used = AM minus PM. ${dayCount ? `${dayCount} daily order days found.` : '<b>No daily order data found for this month.</b>'} Orders are rebuilt from today's pars, so a month where pars changed can differ slightly from what was actually sent.</p>
    <div class="table-box"><table class="t">
      <thead><tr><th>Item</th><th>Unit</th><th class="num">Delivered</th><th class="num">Used</th><th class="num">Billed qty</th><th class="num">Price / unit</th><th class="num">Amount</th></tr></thead>
      <tbody>${aRows || '<tr><td colspan="7" class="muted small" style="padding:12px">No bulk items are linked to daily order items yet (Bulk Cooking tab).</td></tr>'}${manualRows('rentonToIss')}</tbody>
      <tfoot><tr><td colspan="6">Total</td><td class="num">${money(A.total)}</td></tr></tfoot>
    </table></div>
    <button class="btn-link" onclick="addManual('rentonToIss')">+ Add other line (credit, catering transfer…)</button>
    ${A.skipped.length ? `<div class="banner warn" style="margin-top:10px"><b>Not billed, no bulk recipe yet:</b> ${A.skipped.map(s => `${esc(s.name)} (${fmt(s.del)} ${esc(s.unit)} delivered)`).join(', ')}</div>` : ''}
  </div>

  <div class="panel">
    <div class="sec-h"><h2>Issaquah → Renton: chicken prep</h2>
      <div class="toolbar" style="margin:0"><span class="small muted">Bill on</span><div class="seg"><button class="${INV.opts.chickenBasis === 'actual' ? 'on' : ''}" onclick="setInvOpt('chickenBasis','actual')">Actual</button><button class="${INV.opts.chickenBasis === 'standard' ? 'on' : ''}" onclick="setInvOpt('chickenBasis','standard')">Standard</button></div><button class="btn btn-white btn-sm" onclick="printInvoice('B')">Print invoice</button></div></div>
    <p class="desc">From the Chicken Prep Log. <b>Actual</b> = raw lbs used × raw chicken price + logged prep time × each person's rate. <b>Standard</b> = lbs produced × the cost per lb of the linked prep item. Big gaps between the two mean the recipe yield or time is off, or the crew was slower or faster than standard.</p>
    ${B.rawPerLb == null ? `<div class="banner warn" style="margin-bottom:10px">Pick the raw chicken ingredient on the Rates tab (and give it a price per lb) so raw cost can be calculated.</div>` : ''}
    ${B.defaultRateUsed.length ? `<div class="banner info" style="margin-bottom:10px">Issaquah default rate used for: ${B.defaultRateUsed.map(esc).join(', ')}. Add their wage in Delivery Data for exact labor.</div>` : ''}
    <div class="table-box"><table class="t">
      <thead><tr><th>Item</th><th class="num">Raw</th><th class="num">Produced</th><th class="num">Raw cost</th><th class="num">Labor</th><th class="num">Actual</th><th class="num">Standard</th><th class="num">Billed</th></tr></thead>
      <tbody>${bRows}</tbody>
    </table></div>
    <h3>Other lines</h3>
    <div class="table-box"><table class="t">
      <thead><tr><th>Description</th><th>Unit</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Amount</th></tr></thead>
      <tbody>${manualRows('issToRenton') || '<tr><td colspan="5" class="muted small" style="padding:12px">Other prep sent to Renton (onions, produce prep…). Add a line.</td></tr>'}</tbody>
      <tfoot><tr><td colspan="4">Total to Renton</td><td class="num">${money(B.total)}</td></tr></tfoot>
    </table></div>
    <button class="btn-link" onclick="addManual('issToRenton')">+ Add other line</button>
  </div>

  <div class="panel">
    <div class="sec-h"><h2>Close the month</h2><button class="btn btn-primary" onclick="saveSnapshot()">Save snapshot</button></div>
    <p class="desc">Freezes both bills with today's prices. Save again if you fix something; earlier snapshots are kept below.</p>
    ${snaps.length ? `<div class="table-box"><table class="t"><thead><tr><th>Saved</th><th>By</th><th class="num">Renton → Issaquah</th><th class="num">Issaquah → Renton</th><th class="num">Net</th><th></th></tr></thead><tbody>${snaps.map((s, i) => `<tr><td>${esc(new Date(s.savedAt).toLocaleString())}</td><td>${esc(s.by || '')}</td><td class="num">${money(s.A.total)}</td><td class="num">${money(s.B.total)}</td><td class="num">${money(s.A.total - s.B.total)}</td><td><button class="btn-link" onclick="printSnapshot(${snaps.length - 1 - i},'A')">Print R→I</button> <button class="btn-link" onclick="printSnapshot(${snaps.length - 1 - i},'B')">Print I→R</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="muted small">No snapshot saved for this month yet.</div>'}
  </div>`;
}
let _loadingMonth = null;
function pickMonth(m) { if (!m) return; saveInvoiceDraft(); billMonth = m; ls('nnc.foodcost.month', m); INV = null; render(); }
function refreshMonth() { saveInvoiceDraft(); delete BILL[billMonth]; INV = null; render(); }
function setInvOpt(k, v) { INV.opts[k] = v; queueInvoiceSave(); render(); }
function addManual(key) { INV.manual[key].push({ desc: '', unit: '', qty: '', price: '' }); queueInvoiceSave(); render(); }
function delManual(key, i) { INV.manual[key].splice(i, 1); queueInvoiceSave(); render(); }
let invTimer = null, invDirty = false;
function queueInvoiceSave() { invDirty = true; clearTimeout(invTimer); invTimer = setTimeout(saveInvoiceDraft, 900); }
async function saveInvoiceDraft() {
  clearTimeout(invTimer); if (!invDirty || !INV) return; invDirty = false;
  try {
    await db.collection('food_cost_invoices').doc(INV.month).set(JSON.parse(JSON.stringify({ month: INV.month, opts: INV.opts, manual: INV.manual, updatedAt: new Date().toISOString() })), { merge: true });
    if (BILL[INV.month]) BILL[INV.month].invoice = Object.assign(BILL[INV.month].invoice || {}, { opts: INV.opts, manual: INV.manual });
  } catch (e) { invDirty = true; toast('Billing notes not saved: ' + (e.code || e.message)); }
}
function snapshotLines() {
  const data = BILL[billMonth];
  const A = calcRentonToIss(billMonth, data), B = calcIssToRenton(billMonth, data);
  return {
    A: { total: r2(A.total), basis: INV.opts.basis, lines: A.rows.filter(r => r.manual || (r.qty && !r.noCost)).map(r => ({ desc: r.name, unit: r.unit, qty: r.qty, price: r.unitCost == null ? 0 : r.unitCost, amount: r2(r.amount) })) },
    B: { total: r2(B.total), basis: INV.opts.chickenBasis, lines: [...B.rows.filter(r => r.inc && r.amount).map(r => ({ desc: `${r.label} (${fmt(r.raw, 1)} lb raw)`, unit: 'lb', qty: r.out, price: r.out ? r.amount / r.out : 0, amount: r2(r.amount) })), ...B.manual.map(r => ({ desc: r.name, unit: r.unit, qty: r.qty, price: r.unitCost, amount: r2(r.amount) }))] },
    markupPct: n(C.settings.markupPct) || 0
  };
}
async function saveSnapshot() {
  const s = Object.assign(snapshotLines(), { savedAt: new Date().toISOString(), by: (auth.currentUser && auth.currentUser.email) || '' });
  try {
    await db.collection('food_cost_invoices').doc(billMonth).set({ month: billMonth, opts: INV.opts, manual: INV.manual, snapshots: firebase.firestore.FieldValue.arrayUnion(JSON.parse(JSON.stringify(s))) }, { merge: true });
    INV.snapshots = (INV.snapshots || []).concat([s]);
    if (BILL[billMonth]) BILL[billMonth].invoice = Object.assign(BILL[billMonth].invoice || {}, { snapshots: INV.snapshots });
    toast('Snapshot saved'); render();
  } catch (e) { toast('Not saved: ' + (e.code || e.message)); }
}
function monthLabel(m) { const { first } = monthRange(m); return first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
function invoiceHtml(which, snap, live) {
  const E = C.settings.entities;
  const from = which === 'A' ? E['nnc-renton'] : E['nnc-iss'];
  const to = which === 'A' ? E['nnc-iss'] : E['nnc-renton'];
  const part = snap[which];
  const num = `${which === 'A' ? 'REN-ISS' : 'ISS-REN'}-${billMonth}`;
  const basis = which === 'A' ? (part.basis === 'used' ? 'trays used (AM minus PM)' : 'trays delivered (nightly orders)') : (part.basis === 'standard' ? 'standard cost per lb produced' : 'actual raw chicken cost plus logged prep labor');
  return `<div class="inv"><h1>Invoice</h1><div>${esc(num)}${live ? ' · DRAFT' : ''}</div>
    <div class="row"><div><b>From</b><br>${esc(from)}</div><div><b>To</b><br>${esc(to)}</div><div><b>Period</b><br>${esc(monthLabel(billMonth))}</div><div><b>Date</b><br>${esc(new Date(snap.savedAt || Date.now()).toLocaleDateString())}</div></div>
    <table><thead><tr><th>Description</th><th>Unit</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Amount</th></tr></thead>
    <tbody>${part.lines.map(l => `<tr><td>${esc(l.desc)}</td><td>${esc(l.unit)}</td><td class="num">${fmt(l.qty)}</td><td class="num">${money4(l.price)}</td><td class="num">${money(l.amount)}</td></tr>`).join('') || '<tr><td colspan="5">No charges</td></tr>'}</tbody>
    <tfoot><tr><td colspan="4">Total due</td><td class="num">${money(part.total)}</td></tr></tfoot></table>
    <div class="note">Billed on ${esc(basis)}. Prices at ${snap.markupPct ? 'cost plus ' + snap.markupPct + '%' : 'cost'} from the Naan N Curry food cost recipes${live ? ' as of today (draft, not a saved snapshot)' : ' as saved ' + esc(new Date(snap.savedAt).toLocaleString())}.</div></div>`;
}
function doPrint(html) {
  document.getElementById('printArea').innerHTML = html;
  document.body.classList.add('printing');
  setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('printing'), 500); }, 50);
}
function printInvoice(which) { doPrint(invoiceHtml(which, snapshotLines(), true)); }
function printSnapshot(i, which) { const s = INV.snapshots[i]; if (s) doPrint(invoiceHtml(which, s, false)); }
</script>
</body>
</html>
